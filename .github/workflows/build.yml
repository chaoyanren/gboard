name: Build GboardIME

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download the pre-extracted engine SO + dict pack from the
      # engine-data-v1 release (created by running setup.sh locally).
      - name: Download engine data
        run: |
          curl -fsSL \
            "https://github.com/chaoyanren/gboard/releases/download/engine-data-v1/gboard-engine-data.tar.gz" \
            -o /tmp/gboard-engine-data.tar.gz
          tar -xzf /tmp/gboard-engine-data.tar.gz
          # Symlink current → actual dict dir so copy_engine_resources finds it
          ln -sfn zh_cn_2026081806 hmmoemdata/current
          echo "Engine data ready:"
          ls -lh gboard_apk_source/resources/lib/arm64-v8a/libintegrated_shared_object.so
          ls hmmoemdata/current/

      - name: Build
        run: ./build.sh build

      - name: Upload GboardIME.app
        uses: actions/upload-artifact@v4
        with:
          name: GboardIME-${{ github.sha }}
          path: GboardIME/build/release/GboardIME.app
          if-no-files-found: error
